# Copy to config/local.toml; this file contains only generic examples.
listen = "127.0.0.1:9080"
title = "Router Console"

[[plugins]]
id = "system"
name = "系统资源"
kind = "system"
interval_secs = 5

[[plugins]]
id = "dns"
name = "基础 DNS"
kind = "dns"
enabled = false
interval_secs = 15
dns_server = "127.0.0.1:53"
dns_name = "example.com"

[[plugins]]
id = "mihomo"
name = "Mihomo"
kind = "http"
enabled = false
probe_url = "http://127.0.0.1:9090/version"
url = "http://localhost:9090/ui/"
# token_env = "MIHOMO_SECRET"

[[plugins]]
id = "sub-store"
name = "Sub-Store"
kind = "link"
enabled = false
url = "http://localhost:17893/"

[[plugins]]
id = "udpxy"
name = "udpxy"
kind = "http"
enabled = false
visible = false
probe_url = "http://127.0.0.1:4022/status"
url = "http://localhost:4022/status"
